<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>AETHER — Deep Fractal Explorer</title>
    <meta
      name="description"
      content="Arbitrary-precision fractal explorer: perturbation rendering with BigInt reference orbits, past the depth float64 can reach."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage" aria-label="Fractal viewport"></canvas>

    <div id="crosshair" class="crosshair" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <path d="M20 5v10M20 25v10M5 20h10M25 20h10" />
        <circle cx="20" cy="20" r="2" />
      </svg>
    </div>

    <div id="readout" class="readout"></div>
    <aside id="panel" class="panel" aria-label="Controls"></aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="fatal" class="fatal" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
